<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据类型与运算符</title>
    <style>
        div{
            width: 180px;
            height: 180px;
            background-color: red;
           color: white;
            margin: 10px;
            text-align: center;

            font-size: 100px;
            float: left;
        }
    </style>
</head>
<body>
    <script>
        var a = 6,b = 1;
        console.log(a + b); 
        console.log(a++,++b);
        console.log(a-b>0?a:b);
        console.log(true&&false,true||false,!true);
        var str = "Hello World", num = 123, bool = true,obj = {name:"张三",age:18},ud,
        kong=null;
        console.log(typeof str,typeof num,typeof bool,typeof obj,typeof ud,typeof kong);
        //js不能用==或者===来判断浮点数是否相等，因为浮点数不能用二进制精确存储
        //数据类型转换:+号的时候讲数字转换成字符串，-只能用于数值运算
        console.log(1+"1","1"-1,"11"+1-1);
        console.log("wangyao"-1);
        //NaN:Not a Number,表示不是一个数字，他与任何变量都不相等包括他自己
        console.log(isNaN("NaN"));
        //isNaN()函数用来判断一个变量是否是NaN,如果是返回true,否则返回false
        console.log(parseInt("123.79"));
        //parseInt()是向下取整

        //parseInt()函数的第二个参数是进制数
        //1-100求和
        var sum =0;
        for(var i=1;i<=10;i++){
            sum+=i;
        }
        //数7 （7的倍数，最大99 个位和十位是7 不显示数字）

    </script>
